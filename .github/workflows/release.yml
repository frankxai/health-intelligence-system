name: Research-preview verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: his-verify-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # Packaging runs first because it intentionally refuses any ignored or untracked worktree
      # artifact and archives only exact blobs from the checked-out commit.
      - name: Package synthetic BIOS candidate
        shell: pwsh
        run: npm run package:release
      - name: Verify synthetic BIOS candidate
        shell: pwsh
        run: npm run verify:release
      - name: Exercise release security regressions
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/test-release-security.ps1 -IncludeCandidateTamper

      - name: Install BIOS validation dependencies
        run: python -m pip install --disable-pip-version-check -r bios/requirements.txt
      - name: Run BIOS adversarial tests
        run: python -m unittest discover -s bios/tests -v

      - name: Enable Corepack
        run: corepack enable
      - name: Install browser-preview dependencies
        run: pnpm --dir apps/bios-steward install --frozen-lockfile --ignore-scripts
      - name: Audit browser-preview production dependencies
        run: pnpm --dir apps/bios-steward audit --prod
      - name: Lint browser preview
        run: pnpm --dir apps/bios-steward lint
      - name: Type-check browser preview
        run: pnpm --dir apps/bios-steward typecheck
      - name: Build read-only synthetic preview
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: pnpm --dir apps/bios-steward build

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
